    Collatz conjecture, with closed-form bounded barriers
  repository: https://github.com/benetandujar72/collatz-admissible-tree
  paper: paper1/main.pdf  # arXiv submission tag arxiv-v1
  status: complete (paper v1); research programme ongoing

authors:
  - name: Benet Andújar Guardado
    role: >-
      sole human author; set the programme, the targets and the acceptance
      criteria; validated all mathematical content; takes full responsibility
    email: bandujar@edutac.es
ai_assistance:
  tool: Claude (Anthropic), Opus-class and successor models, sessions 2025-2026
  role: >-
    drafted Lean proofs, numerical gates and refactors under the funnel
    methodology (numerical gate -> adversarial verification -> Lean
    authentication); two plausible AI-produced intermediate claims were
    refuted at the adversarial stage and never entered the corpus
  disclosure: >-
    every commit carries a Co-Authored-By trailer; the paper discloses the
    collaboration in the acknowledgements and in Section 9 (methodology,
    evidence tiers T1/T1'/T2/T3)
  trust_basis: >-
    correctness rests on the Lean kernel and the stated axioms, not on
    either collaborator

