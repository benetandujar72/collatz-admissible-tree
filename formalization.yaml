key_results:  # informal statement -> Lean name (all audited above)
  - { lean: collatz_F2X, informal: "every nonzero f in F2[x] reaches 1 under the Collatz analogue (HMYZ 2008); believed first formalization" }
  - { lean: kappa_barrier_m1_Q7, informal: "closed-form bit-length potential proves the bounded kappa-barrier, m=1, Q<=7" }
  - { lean: no_linear_size_potential_m1_Q8, informal: "no rational linear (1,j,size) potential satisfies the contract at (1,8): the wall is exact" }
  - { lean: linear_size_potential_m1_Q7, informal: "the linear relaxation of PhiBitlen satisfies the universal contract at (1,7): the wall is exact on both sides" }
  - { lean: no_hybrid_potential_m1_Q8, informal: "adding singular attractor poles nu3(c-+1) does not move the wall: the enriched class is already dead at (1,8)" }
  - { lean: invReachable_units, informal: "every unit cylinder mod 3^t is reachable: no separating congruence invariant exists" }
  - { lean: no_decaying_modulus_corrector, informal: "no 3-adically continuous real potential satisfies the contract (m <= omega(22+Q))" }
  - { lean: not_blockBoundaryExists, informal: "the canonical split devices for the per-block induction are refuted (astronomical one-edge ladder)" }
  - { lean: syr_cycle_window, informal: "every nontrivial Syracuse m-cycle has m*log2(3) < A < 2m" }
  - { lean: syr_no_cycle_below_16266, informal: "conditional on verification up to 2^29: no Syracuse cycle of period < 16266 (Eliahou-Hercher pipeline, kernel-checked)" }

honest_scope: >-
  The paper claims no progress on the Collatz conjecture itself.  Its content
  is a machine-checked obstruction map for potential-based strategies on the
  inverse cylinder tree, the strongest closed-form barriers those
  obstructions permit, a verified cycle pipeline, and the function-field
  control experiment.

